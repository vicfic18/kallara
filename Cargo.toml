[workspace]
members = ["kallara-core", "kallara-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kallara Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tar = "0.4.46"
zstd = "0.14.3"
aes-gcm = { version = "0.10.3", features = ["stream", "aes"] }
argon2 = { version = "0.5.3", features = ["alloc", "rand"] }
bincode = "1.3.3"
jwalk = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
rand = "0.8.5"
rfd = { version = "0.18.0", features = ["xdg-portal"] }
dioxus = { version = "0.6.3", features = ["desktop"] }

[profile.release]
opt-level = "z"       # Optimize for binary size
lto = "fat"           # Full link-time optimization across crates
codegen-units = 1     # Maximize size reduction and inlining
panic = "abort"       # Remove unwinding tables (~300KB savings)
strip = "symbols"     # Strip symbol table
